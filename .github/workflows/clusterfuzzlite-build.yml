name: ClusterFuzzLite baseline builds

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'configure.ac'
      - 'modules/xml/**'
      - 'modules/cef/**'
      - 'modules/kvformat/**'
      - 'modules/csvparser/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/clusterfuzzlite-build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Upload baseline build (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: c
          sanitizer: ${{ matrix.sanitizer }}
          upload-build: true
