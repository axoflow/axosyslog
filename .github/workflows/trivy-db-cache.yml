name: Trivy DB cache

# Downloads the Trivy vulnerability DB once a day into the GitHub Actions cache
# of the default branch, where trivy-action restores it from in every branch.
# This keeps scans from hitting the rate limits of the public DB registries.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-trivy-db:
    name: Update Trivy DB cache
    runs-on: ubuntu-latest
    steps:
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.70.0

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # The image does not contain Java, so the Java DB is not needed.
      - name: Download vulnerability DB
        run: trivy image --download-db-only --cache-dir "$GITHUB_WORKSPACE/.cache/trivy"
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2

      # Path and key must match what trivy-action restores.
      - name: Save DB to cache
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.date.outputs.date }}
