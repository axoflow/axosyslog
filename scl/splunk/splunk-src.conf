block source splunk_hec(
  token()
  port(8088)
  prefix(".splunk.")
  ...)
{
@requires http "The splunk-hec() source depends on the AxoSyslog http module, please install the axosyslog-mod-http (Debian & derivatives) or the axosyslog-http (RHEL & co) package"
@requires json-plugin "The splunk-hec() source depends on the AxoSyslog json module, please install the axosyslog-mod-json (Debian & derivatives) or the axosyslog-json (RHEL & co) package"

  channel {
    source {
      ehttp(
        port(`port`)
        mode("auto")
        flags(no-parse)
        auth-token("Splunk `token`")
        response-body('{"text":"Success","code":0}')
        `__VARARGS__`
      );
    };

    if {
      parser {
        json-parser(prefix("`prefix`"));
      };

      rewrite {
        set("${`prefix`event}" value("MESSAGE") condition("${`prefix`event}" ne ""));
        set("${`prefix`host}" value("HOST") condition("${`prefix`host}" ne ""));
      };

      if ("${`prefix`time}" ne "") {
        parser {
          date-parser(
            template("${`prefix`time}")
            format("%s.%f" "%s")
          );
        };
      };
    } else {
      parser {
        syslog-parser();
      };
    };
  };
};
